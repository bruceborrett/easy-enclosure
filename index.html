<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Easy Enclosure - Moved to easyenclosure.org</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="canonical" href="https://easyenclosure.org/" />
    <meta http-equiv="refresh" content="1;url=https://easyenclosure.org/" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <script>
      window.location.replace("https://easyenclosure.org/" + (window.location.search || "") + (window.location.hash || ""));
    </script>
    <style>
      :root {
        --bg-canvas: #ecf2f8;
        --surface: rgba(255, 255, 255, 0.94);
        --surface-border: rgba(108, 130, 156, 0.28);
        --text-primary: #1f2f42;
        --text-secondary: #5c728a;
        --ui-primary: #2f5d85;
        --ui-primary-hover: #224767;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: radial-gradient(600px 340px at 10% 8%, rgba(117, 156, 201, 0.24), transparent 72%),
                    radial-gradient(560px 360px at 88% 92%, rgba(139, 169, 194, 0.2), transparent 76%),
                    var(--bg-canvas);
        color: var(--text-primary);
        padding: 24px;
      }
      .card {
        max-width: 440px;
        width: 100%;
        background: var(--surface);
        backdrop-filter: blur(8px);
        border: 1px solid var(--surface-border);
        border-radius: 20px;
        padding: 40px 32px;
        text-align: center;
        box-shadow: 0 16px 40px rgba(38, 65, 95, 0.12);
      }
      .logo {
        width: 72px;
        height: 72px;
        margin: 0 auto 20px auto;
        display: block;
      }
      h1 {
        font-size: 22px;
        font-weight: 800;
        letter-spacing: -0.01em;
        margin-bottom: 12px;
        color: var(--text-primary);
      }
      p {
        font-size: 14px;
        line-height: 1.6;
        color: var(--text-secondary);
        margin-bottom: 24px;
      }
      .spinner {
        width: 24px;
        height: 24px;
        border: 3px solid rgba(47, 93, 133, 0.2);
        border-top-color: var(--ui-primary);
        border-radius: 50%;
        margin: 0 auto 20px auto;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      .btn {
        display: inline-block;
        background: var(--ui-primary);
        color: #ffffff;
        font-size: 13px;
        font-weight: 600;
        text-decoration: none;
        padding: 10px 20px;
        border-radius: 10px;
        transition: background 0.15s ease;
      }
      .btn:hover {
        background: var(--ui-primary-hover);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="easy-enclosure-logo.svg" alt="Easy Enclosure Logo" class="logo" />
      <div class="spinner"></div>
      <h1>We have moved!</h1>
      <p>
        Easy Enclosure is now hosted at our permanent domain:<br />
        <a href="https://easyenclosure.org" style="color: var(--ui-primary); font-weight: 700; text-decoration: none;">easyenclosure.org</a>
      </p>
      <p style="font-size: 13px; margin-bottom: 24px;">
        Redirecting you to our new URL...
      </p>
      <a href="https://easyenclosure.org" class="btn">Click here if not redirected automatically</a>
    </div>
  </body>
</html>
